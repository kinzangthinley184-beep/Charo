name: charo
description: "Charo — Connecting Bhutan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  pin_code_fields: ^9.3.0
  provider: ^6.1.2
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2
  cloud_firestore: ^6.4.1
  geolocator: ^14.0.2
  firebase_storage: ^13.4.1
  image_picker: ^1.0.0
  firebase_messaging: ^16.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/charo_logo.png